name: Late recruit gear diagnostic

on:
  push:
    branches:
      - fix/late-recruit-field-gear
    paths:
      - .github/workflows/late-recruit-gear-diagnostic.yml
      - tests/lateRecruitGearDiagnostic.test.ts
      - src/game/recruitment/candidateGenerator.ts
      - src/data/equipment/**

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/lateRecruitGearDiagnostic.test.ts
