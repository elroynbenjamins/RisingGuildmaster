name: Focused Nhal balance
on:
  push:
    branches:
      - balance/nhal-prepared-reliability
concurrency:
  group: focused-nhal-balance
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/chapter8WesternSea.test.ts tests/lateCampaignScaling.test.ts tests/balanceSimulation.test.ts -t "Chapter 8|late campaign encounter scaling|prepared Standard casualty pressure through Chapters 7–9|keeps underprepared late-chapter bosses"
