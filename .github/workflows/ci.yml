name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: nhal-wide-sample-${{ github.sha }}
  cancel-in-progress: true

jobs:
  nhal-wide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/lateBossDifficultyRobustness.test.ts -t "confirms prepared Veteran Nhal viability across a wider sample" --reporter=verbose
