name: Focused current late balance
on:
  push:
    branches:
      - balance/late-casualty-current-main
concurrency:
  group: focused-current-late-balance
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/balanceSimulation.test.ts -t "keeps prepared Hard and Iron parties viable|prepared Standard casualty pressure through Chapters 7–9|underprepared late-chapter bosses"
