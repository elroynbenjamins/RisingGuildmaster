name: Chapter 9 replacement recovery check

on:
  push:
    branches:
      - balance/ch9-replacement-recovery-guard
    paths:
      - .github/workflows/ch9-replacement-recovery-check.yml
      - tests/campaignPreparationGuide.test.ts
      - tests/dungeonRunIntegration.test.ts
      - src/game/campaign/campaignPreparationGuide.ts
      - src/game/dungeons/dungeonRunService.ts

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/campaignPreparationGuide.test.ts tests/dungeonRunIntegration.test.ts
