      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/chapter1To5PreparedReliability.test.ts -t "Chapter 3 prepared" --reporter=verbose

  chapter4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
