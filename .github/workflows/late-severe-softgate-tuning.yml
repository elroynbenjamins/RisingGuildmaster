name: Late severe soft gate tuning
on:
  push:
    branches:
      - balance/late-severe-softgate-tuning
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/lateSevereSoftGateDiagnostics.test.ts
