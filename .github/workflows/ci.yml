name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: late-midmission-final-sample-${{ github.sha }}
  cancel-in-progress: true

jobs:
  veteran-robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/lateMidMissionDifficultyRobustness.test.ts -t "keeps prepared Veteran Skyvault and Tidewatch viable" --reporter=verbose
