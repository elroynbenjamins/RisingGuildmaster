name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: chapter6-curve-${{ github.sha }}
  cancel-in-progress: true

jobs:
  chapter6-curve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/chapter6DifficultyRobustness.test.ts -t "keeps the Greenveil curve ordered" --reporter=verbose
