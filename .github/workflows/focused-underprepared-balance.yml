name: Focused underprepared balance
on:
  push:
    branches:
      - balance/underprepared-casualty-guard
concurrency:
  group: focused-underprepared-balance-v3
  cancel-in-progress: true
jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/lateTransitionDiagnostics.test.ts
