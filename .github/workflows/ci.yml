name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: late-midmission-openers-${{ github.sha }}
  cancel-in-progress: true

jobs:
  skyvault-opener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/lateMidMissionDifficultyRobustness.test.ts -t "isolates skyvault opening-stage attrition" --reporter=verbose

  tidewatch-opener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/lateMidMissionDifficultyRobustness.test.ts -t "isolates tidewatch opening-stage attrition" --reporter=verbose

  chain-opener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/lateMidMissionDifficultyRobustness.test.ts -t "isolates chain opening-stage attrition" --reporter=verbose
