name: Current main late balance
on:
  push:
    branches:
      - balance/current-main-late-validation
concurrency:
  group: current-main-late-final
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/chapter9DrownedSeventh.test.ts tests/lateCampaignScaling.test.ts tests/balanceSimulation.test.ts -t "Chapter 9|late campaign encounter scaling|prepared Standard casualty pressure through Chapters 7–9|keeps underprepared late-chapter bosses dangerous without becoming guaranteed wipes|keeps late boss preparation meaningfully better across shared seeds|keeps prepared Hard and Iron parties viable without making them forgiving"
