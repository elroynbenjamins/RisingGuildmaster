name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: tidewatch-opening-${{ github.sha }}
  cancel-in-progress: true

jobs:
  tidewatch-opening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/lateNonBossDifficultyRobustness.test.ts -t "isolates Tidewatch Veteran opening pressure on the paired seed" --reporter=verbose
