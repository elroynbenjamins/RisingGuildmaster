name: Campaign pacing validation
on:
  push:
    branches:
      - balance/campaign-pacing-final
concurrency:
  group: campaign-pacing-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/chapterXpCurve.test.ts tests/quests.test.ts tests/raids.test.ts tests/postBattleGuidance.test.ts
