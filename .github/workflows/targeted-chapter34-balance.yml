name: Targeted Chapter 3-4 Balance

on:
  push:
    branches:
      - balance/chapter3-4-transition-robustness-v2

jobs:
  targeted-balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Chapter 3-4 balance guards
        run: pnpm vitest run tests/chapter3DifficultyRobustness.test.ts tests/chapter4TransitionRobustness.test.ts --reporter=verbose
