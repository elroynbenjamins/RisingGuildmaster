name: Serekh hard raid diagnostic
on:
  push:
    branches:
      - diagnostic/serekh-hard-raid
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/balanceSimulation.test.ts tests/raidBalanceSimulation.test.ts -t "keeps prepared Hard and Iron parties viable without making them forgiving|measures Chartmaker with a normal Lv 18 progressed raid roster"
