name: Premium class early gear validation
on:
  push:
    branches:
      - balance/premium-class-early-gear
concurrency:
  group: premium-class-early-gear-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/premiumClassEarlyGearDiagnostics.test.ts
