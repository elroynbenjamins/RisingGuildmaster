name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ch1-5-prepared-reliability-${{ github.sha }}
  cancel-in-progress: true

jobs:
  chapter1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/chapter1To5PreparedReliability.test.ts -t "Chapter 1 prepared" --reporter=verbose

  chapter2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/chapter1To5PreparedReliability.test.ts -t "Chapter 2 prepared" --reporter=verbose

  chapter3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
