name: Chartmaker raid diagnostics
on:
  push:
    branches:
      - balance/chartmaker-raid-diagnostics
concurrency:
  group: chartmaker-raid-diagnostics
  cancel-in-progress: true
jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/chartmakerRaidDiagnostics.test.ts
