name: Late role substitution diagnostic

on:
  push:
    branches:
      - diagnostic/late-role-substitutions
    paths:
      - .github/workflows/late-role-substitution-diagnostic.yml
      - tests/lateRoleSubstitutionDiagnostic.test.ts
      - src/game/simulation/balanceSimulation.ts
      - src/data/classes/**
      - src/data/skills/**
      - src/data/equipment/**
      - src/data/encounters/**
      - src/data/quests/**

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/lateRoleSubstitutionDiagnostic.test.ts
