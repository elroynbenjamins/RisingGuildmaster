name: Late replacement hero diagnostic

on:
  push:
    branches:
      - balance/late-replacement-hero-robustness
    paths:
      - .github/workflows/late-replacement-hero-diagnostic.yml
      - tests/lateReplacementHeroDiagnostic.test.ts
      - src/game/simulation/balanceSimulation.ts

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/lateReplacementHeroDiagnostic.test.ts
