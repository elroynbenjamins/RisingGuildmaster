name: Early primary gear source validation
on:
  push:
    branches:
      - balance/early-primary-gear-source-audit
concurrency:
  group: early-primary-gear-source-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/chapter2Campaign.test.ts tests/chapter3Frostmarch.test.ts tests/equipmentBalanceCoverage.test.ts
