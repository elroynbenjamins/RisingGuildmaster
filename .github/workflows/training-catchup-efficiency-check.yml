name: Training catch-up efficiency check

on:
  push:
    branches:
      - balance/training-catchup-efficiency
    paths:
      - .github/workflows/training-catchup-efficiency-check.yml
      - src/data/training/trainingPrograms.ts
      - src/game/training/trainingService.ts
      - src/game/campaign/campaignPreparationGuide.ts
      - tests/trainingGrounds.test.ts
      - tests/trainingPresentation.test.ts
      - tests/campaignPreparationGuide.test.ts

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/trainingGrounds.test.ts tests/trainingPresentation.test.ts tests/campaignPreparationGuide.test.ts
