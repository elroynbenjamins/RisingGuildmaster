name: Chapter 5 gear throughput audit
on:
  push:
    branches:
      - balance/ch5-gear-throughput-audit
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/ch5GearThroughputDiagnostics.test.ts
