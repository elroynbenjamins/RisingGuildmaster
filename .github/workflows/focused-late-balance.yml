name: Focused late balance
on:
  push:
    branches:
      - balance/ch7-9-casualty-band

jobs:
  late-balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/balanceSimulation.test.ts -t "prepared Standard casualty pressure through Chapters 7–9|keeps underprepared late-chapter boss parties"
