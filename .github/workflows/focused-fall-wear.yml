name: Focused fall wear
on:
  push:
    branches:
      - balance/single-fall-wear-penalty
concurrency:
  group: focused-fall-wear
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/equipmentDurability.test.ts tests/quests.test.ts
