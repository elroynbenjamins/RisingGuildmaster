name: Chapter 4-6 Balance Diagnostic

on:
  pull_request:

concurrency:
  group: chapter46-balance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Chapter 4-6 diagnostic
        run: pnpm vitest run tests/chapter46DifficultyDiagnostic.test.ts --reporter=verbose
