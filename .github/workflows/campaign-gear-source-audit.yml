name: Campaign gear source validation
on:
  push:
    branches:
      - balance/campaign-gear-source-audit
concurrency:
  group: campaign-gear-source-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/equipmentBalanceCoverage.test.ts tests/campaignGearIcons.test.ts tests/craftingEquipment.test.ts
      - run: pnpm vitest run tests/balanceSimulation.test.ts -t "reports Chapter 4–6 transition combat|reports prepared Standard survivor baselines"
