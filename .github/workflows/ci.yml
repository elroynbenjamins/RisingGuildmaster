name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: late-midmission-stage2-${{ github.sha }}
  cancel-in-progress: true

jobs:
  skyvault-two-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/lateMidMissionDifficultyRobustness.test.ts -t "isolates skyvault through stage two" --reporter=verbose

  tidewatch-two-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/lateMidMissionDifficultyRobustness.test.ts -t "isolates tidewatch through stage two" --reporter=verbose
