name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: chapter6-targeted-${{ github.sha }}
  cancel-in-progress: true

jobs:
  chapter6-curve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/chapter6DifficultyRobustness.test.ts -t "keeps the Greenveil curve ordered" --reporter=verbose

  chapter6-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/chapter6DifficultyRobustness.test.ts -t "makes preparation materially matter" --reporter=verbose

  chapter6-cassian-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/chapter6DifficultyRobustness.test.ts -t "isolates Cassian honor-guard attrition" --reporter=verbose

  chapter6-compositions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/chapter6DifficultyRobustness.test.ts -t "keeps prepared Iron Cassian viable" --reporter=verbose

  chapter6-progression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/chapter6DifficultyRobustness.test.ts tests/campaignReadiness.test.ts -t "Level-11 Sixth Voice|Level-10 Greenveil catch-up" --reporter=verbose
