name: Late party composition guard check

on:
  push:
    branches:
      - balance/late-party-composition-guard
    paths:
      - .github/workflows/late-party-composition-guard-check.yml
      - tests/balanceSimulation.test.ts

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/balanceSimulation.test.ts -t "keeps alternate late parties viable while preserving preparation pressure"
