name: Final late casualty validation
"on":
  push:
    branches:
      - "balance/final-late-casualty-corrections"
concurrency:
  group: final-late-casualty-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/chapter7IronHills.test.ts tests/chapter8WesternSea.test.ts tests/chapter9DrownedSeventh.test.ts tests/lateCampaignScaling.test.ts tests/balanceSimulation.test.ts -t "Chapter 7|Chapter 8|Chapter 9|late campaign encounter scaling|prepared Standard casualty pressure through Chapters 7–9|separates prepared, underprepared and severely underprepared late boss outcomes|keeps prepared Hard and Iron parties viable"
