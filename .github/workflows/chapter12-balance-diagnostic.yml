name: Chapter 1-2 Balance Diagnostic

on:
  pull_request:

concurrency:
  group: chapter12-balance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chapter 1-2 balance diagnostics
        run: pnpm vitest run tests/chapter12DifficultyBalance.test.ts tests/chapter12SideQuestBalance.test.ts --reporter=verbose
