name: Wardstone primary cache validation
on:
  push:
    branches:
      - balance/wardstone-primary-cache-priority
concurrency:
  group: wardstone-primary-cache-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/dungeonRuns.test.ts tests/dungeonRunIntegration.test.ts tests/campaignPreparationGuide.test.ts
      - run: pnpm vitest run tests/wardstonePrimaryCacheDiagnostics.test.ts
