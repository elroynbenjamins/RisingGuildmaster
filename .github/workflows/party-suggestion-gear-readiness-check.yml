name: Gear-aware party suggestion check

on:
  push:
    branches:
      - balance/party-suggestion-gear-readiness
    paths:
      - .github/workflows/party-suggestion-gear-readiness-check.yml
      - src/game/party/heroFieldReadinessService.ts
      - src/game/party/partyRecommendationService.ts
      - src/game/party/questDeploymentService.ts
      - tests/partyRecommendationGearReadiness.test.ts
      - tests/questDeployment.test.ts

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/partyRecommendationGearReadiness.test.ts tests/questDeployment.test.ts
