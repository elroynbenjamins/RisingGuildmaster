name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: late-boss-opener-${{ github.sha }}
  cancel-in-progress: true

jobs:
  late-boss-openers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/lateBossDifficultyRobustness.test.ts -t "isolates Varkesh and Nhal opening-stage attrition" --reporter=verbose
