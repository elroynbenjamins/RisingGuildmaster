name: Late replacement role check

on:
  push:
    branches:
      - test/late-replacement-role-robustness
    paths:
      - .github/workflows/late-replacement-role-check.yml
      - tests/balanceSimulation.test.ts
      - src/game/simulation/balanceSimulation.ts

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/balanceSimulation.test.ts -t "keeps one-level-behind replacements viable across late party roles"
