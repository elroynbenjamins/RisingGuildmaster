name: Focused post battle prep
on:
  push:
    branches:
      - ux/post-battle-preparation-guidance
concurrency:
  group: focused-post-battle-prep
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/postBattleGuidance.test.ts tests/campaignPreparationGuide.test.ts
