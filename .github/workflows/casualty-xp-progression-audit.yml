name: Casualty XP progression audit
on:
  push:
    branches:
      - balance/casualty-xp-progression-audit
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/quests.test.ts tests/dungeonRunIntegration.test.ts tests/chapterXpCurve.test.ts tests/postBattleGuidance.test.ts
