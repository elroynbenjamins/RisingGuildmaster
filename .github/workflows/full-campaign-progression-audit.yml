name: Full campaign progression audit
on:
  push:
    branches:
      - balance/full-campaign-progression-audit
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm vitest run tests/chapterXpCurve.test.ts tests/raids.test.ts
